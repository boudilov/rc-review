<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Структура РЦ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="structure-stage" class="structure-stage" aria-label="Визуализация структуры"></div>

    <div id="hud-count" class="hud-bl">загрузка…</div>
  </div>

  <div id="rc-mosaic-overlay" class="overlay" aria-hidden="true">
    <div class="rc-mosaic-panel" role="dialog" aria-modal="true" aria-label="Команда РЦ">
      <div class="rc-mosaic-grid" data-rc-mosaic></div>
    </div>
  </div>

  <div id="rc-photo-lightbox" class="overlay rc-photo-lightbox" aria-hidden="true">
    <img class="rc-photo-lightbox-img" alt="" />
  </div>

  <div id="workshop-overlay" class="overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="workshop-title">
      <div id="workshop-title" class="dialog-title">Ресурсный центр</div>
      <div class="dialog-body">
        <div class="workshop-dialog-name" data-workshop-name>—</div>
        <div class="workshop-meta">
          <div class="workshop-meta-row">
            <span class="workshop-meta-label">Код</span>
            <span data-workshop-code>—</span>
          </div>
          <div class="workshop-meta-row">
            <span class="workshop-meta-label">Техническая группа</span>
            <span data-workshop-tg>—</span>
          </div>
          <div class="workshop-meta-row">
            <span class="workshop-meta-label">Сотрудники</span>
            <span data-workshop-count>—</span>
          </div>
        </div>
        <ul class="workshop-staff" data-workshop-staff></ul>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-box">
      <div id="confirm-title" class="confirm-title">Подтверждение</div>
      <div id="confirm-text" class="confirm-text">Выполнить действие?</div>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" class="btn">Отмена</button>
        <button id="confirm-ok" type="button" class="btn">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="structure-main.js"></script>
</body>
</html>
