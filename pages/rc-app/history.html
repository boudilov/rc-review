<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>История РЦ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="workspace-content" class="workspace-content" aria-live="polite"></div>

    <div class="hud-br">
      <button type="button" class="btn btn-primary" id="help-trigger">help</button>
    </div>
  </div>

  <div id="help-overlay" class="overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div id="help-title" class="dialog-title">Управление</div>
      <div class="dialog-body">
        <div class="help-section">История</div>
        <p class="help-row"><span class="kbd">клик</span><span class="help-row-desc">следующий шаг</span></p>
        <p class="help-row"><span class="kbd">прав. клик</span><span class="help-row-desc">предыдущий шаг</span></p>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="history-main.js"></script>
</body>
</html>
